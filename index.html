<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Prasuna Mannava, Healthcare AI Engineer in San Jose, CA.">
<title>Prasuna Mannava Portfolio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,700;1,6..72,300&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#fbfbfa; --ink:#1b1d1c; --muted:#6b706d; --line:#e6e8e6; --accent:#7b1e3a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Newsreader",Georgia,"Times New Roman",serif;font-size:18px;line-height:1.6;padding-inline:20px;padding-block:56px}
body::after{content:"";position:fixed;top:0;right:0;bottom:0;width:22px;background:linear-gradient(to right,var(--bg) 0 3px,var(--accent) 3px 5px,var(--bg) 5px 8px,var(--accent) 8px 100%);pointer-events:none}
@media (max-width:600px){body{padding-right:36px}}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:44px}
header{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.photo{width:76px;height:76px;border-radius:50%;object-fit:cover;border:1px solid var(--line);flex:none}
h1{font-size:1.9rem;font-weight:700;margin:0;line-height:1.15;letter-spacing:-.01em}
.tag{margin:2px 0 0;line-height:1.3;color:var(--muted)}
.hero{font-size:clamp(26px,3.4vw,38px);font-weight:300;line-height:1.12;letter-spacing:-.02em;margin:0;max-width:62ch;text-wrap:balance}
.hero em{font-style:italic;color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="photo" src="photo.jpg" alt="Prasuna Mannava" onerror="this.remove()">
    <div>
      <h1>Prasuna Mannava</h1>
      <p class="tag">Healthcare AI Engineer · San Jose, CA</p>
    </div>
  </header>

  <p class="hero">From healthcare operations to healthcare AI. <em>Always finding a way to make it better. Always building.</em></p>
</div>
</body>
</html>
